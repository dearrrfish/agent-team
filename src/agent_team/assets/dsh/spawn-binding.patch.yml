# Optional profile overlay. Merge with the effective tool-subagent config first.
# A Cordis patch replaces this row's config as a whole.
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    # Select the coordinator as the session preset. Fresh children use worker presets.
    allowedAgentPresets:
      - agent-team-explorer
      - agent-team-design-agent
      - agent-team-implementer
      - agent-team-ops
      - agent-team-reviewer

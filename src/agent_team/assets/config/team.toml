# Personal defaults, shared live by projects unless they opt out.
# Relative sources and profiles are rooted at ~/.agent-team.
# workflow.run_root is always interpreted relative to the active project.

# Configuration schema; version 1 is supported.
# Projects may set this top-level field false to isolate their defaults.
inherit_user_defaults = true
schema_version = 1
# Team identifier in lowercase kebab-case.
id = "default"
# Human-readable team name.
name = "Native agent team"
# Short team description.
description = "Portable role-based agent team"
# adaptive, solo, assisted, or team.
default_tier = "adaptive"
# economy, balanced, or quality.
default_model_preset = "balanced"
# Native targets available to install and render.
enabled_targets = ["codex", "claude", "antigravity"]
# Ordered custom directories; whole role IDs replace builtins.
role_sources = ["builtin:roles"]
# Ordered custom directories; whole skill IDs replace builtins.
skill_sources = ["builtin:skills"]

[target_profiles]
# Target profile reference: builtin target or a relative TOML file.
codex = "builtin:codex"
# Target profile reference: builtin target or a relative TOML file.
claude = "builtin:claude"
# Target profile reference: builtin target or a relative TOML file.
antigravity = "builtin:antigravity"

[workflow]
# Project-relative directory containing run artifacts.
run_root = ".agent-team/runs"
# Maximum independent review cycles (1 through 3).
review_cycle_limit = 2
# Enable deep discovery by default.
deep_discovery_default = false
# Require an explicit worktree decision.
require_worktree_decision = true
# Persist structured worker reports.
persist_agent_reports = true

[tiers.solo]
# Solo requires exactly zero workers.
max_workers = 0
# Assisted and team require durable artifacts; solo may disable them.
durable_artifacts = false
# Team requires a separate read-only reviewer; other tiers may disable it.
independent_review = false
# Required isolation policy for this tier.
write_isolation = "coordinator-only"

[tiers.assisted]
# Assisted permits one or two workers.
max_workers = 2
# Assisted and team require durable artifacts; solo may disable them.
durable_artifacts = true
# Team requires a separate read-only reviewer; other tiers may disable it.
independent_review = false
# Required isolation policy for this tier.
write_isolation = "serialized"

[tiers.team]
# Team permits two through eight workers.
max_workers = 4
# Assisted and team require durable artifacts; solo may disable them.
durable_artifacts = true
# Team requires a separate read-only reviewer; other tiers may disable it.
independent_review = true
# Required isolation policy for this tier.
write_isolation = "file-disjoint-or-worktree"

[install]
# Default installation destination: project or user.
default_scope = "project"
# Conflict behavior; version 1 requires refuse.
overwrite = "refuse"
# Preserve replaced managed files in project backups.
backups = true
# Version 1 requires false; native settings remain managed separately.
modify_native_settings = false


# Effort fields are supported only for targets whose features.supports_effort is true.
# Each complete profile below is a separate file, not a section to uncomment here.
# Complete custom target profile example: save the following target sections
# into e.g. targets/codex.toml, then use target_profiles.codex = "targets/codex.toml".


# coordinator_effort = "medium"
# [presets.balanced.models]
# fast = "gpt-6-luna"
# balanced = "gpt-5.6-terra"
# deep = "gpt-6-sol"
# [presets.balanced.effort]
# low = "low"
# medium = "medium"
# high = "high"

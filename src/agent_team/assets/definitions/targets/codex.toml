schema_version = 1
id = "codex"
adapter = "codex"
agent_destination = ".codex/agents"
skill_destination = ".agents/skills"
user_agent_destination = ".codex/agents"
user_skill_destination = ".agents/skills"
models_without_effort = []

[features]
supports_effort = true
effort_levels = ["low", "medium", "high", "xhigh", "max", "ultra"]
supports_worktree_isolation = true
team_runtime = "subagents"

[presets.economy]
coordinator_model = "gpt-5.6-terra"
coordinator_effort = "medium"
[presets.economy.models]
fast = "gpt-5.6-luna"
balanced = "gpt-5.6-terra"
deep = "gpt-5.6-terra"
[presets.economy.effort]
low = "low"
medium = "medium"
high = "medium"

[presets.balanced]
coordinator_model = "gpt-5.6-sol"
coordinator_effort = "medium"
[presets.balanced.models]
fast = "gpt-5.6-luna"
balanced = "gpt-5.6-terra"
deep = "gpt-5.6-sol"
[presets.balanced.effort]
low = "low"
medium = "medium"
high = "high"

[presets.quality]
coordinator_model = "gpt-6-astra"
coordinator_effort = "medium"
[presets.quality.models]
fast = "gpt-5.6-terra"
balanced = "gpt-5.6-sol"
deep = "gpt-6-astra"
[presets.quality.effort]
low = "medium"
medium = "high"
high = "xhigh"

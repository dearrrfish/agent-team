deep = "sonnet"
[presets.economy.effort]
low = "low"
medium = "medium"
high = "medium"

[presets.balanced]
coordinator_model = "sonnet"
coordinator_effort = "high"
[presets.balanced.models]
fast = "haiku"
balanced = "sonnet"
deep = "sonnet"
[presets.balanced.effort]
low = "low"
medium = "medium"
high = "high"

[presets.quality]
coordinator_model = "opus"
coordinator_effort = "high"
[presets.quality.models]
fast = "sonnet"
balanced = "sonnet"

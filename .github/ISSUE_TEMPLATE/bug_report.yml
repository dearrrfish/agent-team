name: Bug report
description: Report reproducible incorrect behavior in agent-team.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug. Do not include secrets or security
        vulnerabilities; use private vulnerability reporting for those.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-team version or commit
      placeholder: v0.1.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Native target
      options:
        - Not target-specific
        - Codex
        - Claude Code
        - Antigravity CLI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Python/Nix, and native-client versions.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Paste minimal logs or doctor output after removing secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same behavior.
          required: true
        - label: I removed credentials, tokens, and private data from this report.
          required: true
